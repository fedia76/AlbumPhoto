name: Publier le modèle de visage

# Récupère le modèle MobileFaceNet (insightface buffalo_sc, usage non commercial)
# et le publie comme asset de la release « models-v1 » de ce dépôt. L'application
# le télécharge depuis cette URL (voir apps/mobile/src/config.ts).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-model.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger et extraire
        run: |
          curl -sSL -o buffalo_sc.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip
          unzip -o buffalo_sc.zip w600k_mbf.onnx
          echo "c5b029527cb6f874e057613fc10bae1b  w600k_mbf.onnx" | md5sum -c -
      - name: Publier la release models-v1 (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view models-v1 >/dev/null 2>&1; then
            gh release upload models-v1 w600k_mbf.onnx --clobber
          else
            gh release create models-v1 w600k_mbf.onnx \
              --target "$GITHUB_SHA" \
              --title "Modèles IA locale v1" \
              --notes "Modèle d'embedding de visage MobileFaceNet (w600k_mbf.onnx) issu du pack insightface buffalo_sc. Entrée 1×3×112×112 RGB, normalisation (x − 127.5) / 127.5, sortie 512. MD5 c5b029527cb6f874e057613fc10bae1b. Licence insightface : usage non commercial."
          fi
